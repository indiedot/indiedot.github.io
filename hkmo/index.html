<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>홍콩·마카오 12월</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: 홍콩(빨강 택시)·마카오(아줄레주 타일 파랑)를 도시 색으로 나눈 세로 타임라인. 날마다 좌표 지도 + 하단 고정 NEXT STOP 바 */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#15202A; --muted:#5A6772; --line:#D4DADF;
  --hk:#C3342A; --mo:#1D5CA3; --done:#2C7A57; --opt:#8C6A17; --chip:#E3E8EC;
  --map:#E4EAEE; --grid:#D3DCE2;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-han:"Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1419; --surface:#162029; --ink:#E5EBEF; --muted:#93A0AB; --line:#25323C;
  --hk:#E8574C; --mo:#6EA2E0; --done:#5BBE8E; --opt:#D8B35A; --chip:#1E2B35;
  --map:#121C24; --grid:#1D2A34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#162029; --ink:#E5EBEF; --muted:#93A0AB; --line:#25323C;
  --hk:#E8574C; --mo:#6EA2E0; --done:#5BBE8E; --opt:#D8B35A; --chip:#1E2B35;
  --map:#121C24; --grid:#1D2A34; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--mo);outline-offset:2px;border-radius:6px}

header{padding-block:22px 6px;display:grid;gap:10px}
.route{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.route b{color:var(--ink);font-weight:600}
.route .dash{flex:1;border-top:1px dashed var(--line)}
h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h1 .hk{color:var(--hk)} h1 .mo{color:var(--mo)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta span b{color:var(--ink);font-weight:500}

.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.pg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:grid;gap:4px}
.pg small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.pg .n{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--city);width:0;transition:width .3s}

nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);
  display:flex;gap:6px;overflow-x:auto;padding-block:12px;margin-top:6px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.info{margin-left:auto}

.day{margin-top:18px}
.dayhead{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding-bottom:10px;border-bottom:2px solid var(--city)}
.code{grid-row:span 2;font-family:var(--f-mono);font-weight:600;font-size:12px;color:#fff;background:var(--city);
  border-radius:6px;padding:3px 7px;letter-spacing:.06em;align-self:center}
.dayhead h2{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
.dayhead p{margin:0;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}

/* 지도 */
.mapbox{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zones{display:flex;gap:4px;padding:8px 8px 0}
.zone{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.zone[aria-selected="true"]{background:var(--chip);color:var(--ink);font-weight:700}
.canvas{position:relative;margin:8px;border-radius:8px;overflow:hidden;background:var(--map)}
.canvas svg{display:block;width:100%;height:auto}
.canvas .lf{width:100%;aspect-ratio:5/3}
.pin{cursor:pointer}
.pin circle{stroke:var(--surface);stroke-width:2.5}
.pin text{font-family:var(--f-mono);font-weight:600;font-size:12px;fill:#fff;pointer-events:none}
.pin.sel circle{stroke:var(--ink);stroke-width:3}
.lbl{font-family:var(--f-body);font-size:12px;font-weight:500;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.scale text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.mapfoot{display:grid;gap:8px;padding:0 10px 10px}
.picked{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:13px;min-height:30px}
.picked b{font-weight:700}
.picked span{color:var(--muted)}
.maplinks{display:flex;flex-wrap:wrap;gap:6px}

ol.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:62px 1fr 36px;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);scroll-margin-top:70px;transition:background .4s}
.stop.flash{background:var(--chip)}
.t{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--city);padding-top:1px;line-height:1.3}
.body{min-width:0;display:grid;gap:3px}
.body h3{margin:0;font-size:15px;font-weight:700;line-height:1.35}
.body p{margin:0;font-size:13px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.tag{font-size:11px;font-family:var(--f-mono);padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--muted)}
.tag.opt{color:var(--opt)}
.num{font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;background:var(--city);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center}
.go{font-size:12px;text-decoration:none;font-weight:500;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--surface);white-space:nowrap}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  display:grid;place-items:center;font-size:14px;color:transparent;transition:all .15s}
.stop.done .chk{background:var(--done);border-color:var(--done);color:#fff}
.stop.done h3{text-decoration:line-through;color:var(--muted)}
.stop.done .t{color:var(--muted)}

.note{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;display:grid;gap:4px}
.note b{font-size:12px;font-family:var(--f-mono);letter-spacing:.05em;color:var(--city)}

/* 정보 탭 */
.sec{margin-top:22px;display:grid;gap:10px}
.sec h2{margin:0;font-size:12px;font-family:var(--f-mono);letter-spacing:.1em;color:var(--muted);font-weight:600}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:grid;gap:8px}
.ticket .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ticket .big{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ticket .lbl2{font-size:12px;color:var(--muted)}
.ticket .perf{border-top:1px dashed var(--line)}
.ticket ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.han{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.han .zh{font-family:var(--f-han);font-size:32px;line-height:1.1;letter-spacing:.04em}
.han .ko{font-size:12.5px;color:var(--muted)}
.han button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.reset{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.reset.armed{color:var(--hk);border-color:var(--hk)}

/* NEXT STOP */
.next{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.next .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.next small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;opacity:.7}
.next .what{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next a{grid-row:span 2;text-decoration:none;background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* 구역별 지도 데이터: 장소를 처음 나온 순서대로 번호 매기고, 이동 순서대로 선 연결 */
function zoneData(d,z){
  const its=d.items.filter(it=>it.k && it.z===z);
  const order=[], seq=[];
  its.forEach(it=>{ if(!order.includes(it.k)) order.push(it.k); if(seq[seq.length-1]!==it.k) seq.push(it.k); });
  return {its,order,seq};
}
function pinNo(d,it){ if(!it.k||!it.z) return null; return zoneData(d,it.z).order.indexOf(it.k)+1; }
function routeUrl(keys,mode){
  const u=keys.filter((k,i)=>keys.indexOf(k)===i||i===keys.length-1).map(k=>P[k].ll.join(','));
  if(u.length<2) return null;
  const mid=u.slice(1,-1).slice(0,8);
  return 'https://www.google.com/maps/dir/?api=1&origin='+u[0]+'&destination='+u[u.length-1]+
    (mid.length?'&waypoints='+encodeURIComponent(mid.join('|')):'')+'&travelmode='+mode;
}

/* ───────── 좌표 지도 (SVG) ─────────
   위도·경도를 화면 좌표로 바꿔요. 경도 1도는 위도에 따라 짧아져서 cos(위도)를 곱해요. */
const W=600,H=360;
function project(keys){
  const pts=keys.map(k=>P[k].ll);
  const lat0=pts.reduce((s,p)=>s+p[0],0)/pts.length, kx=Math.cos(lat0*Math.PI/180);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  pts.forEach(([la,lo])=>{const x=lo*kx,y=-la; minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  let dx=maxX-minX, dy=maxY-minY; const minSpan=0.012; // 한 곳만 있어도 약 1.3km 범위로 보여주기
  if(dx<minSpan){const c=(minX+maxX)/2;minX=c-minSpan/2;maxX=c+minSpan/2;dx=minSpan;}
  if(dy<minSpan*0.6){const c=(minY+maxY)/2;minY=c-minSpan*0.3;maxY=c+minSpan*0.3;dy=minSpan*0.6;}
  const pad=0.16, s=Math.min(W*(1-2*pad)/dx, H*(1-2*pad)/dy);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const f=([la,lo])=>[W/2+(lo*kx-cx)*s, H/2+(-la-cy)*s];
  const mPerPx=111320/s; // 1도 ≈ 111.32km
  return {f,mPerPx};
}
function niceLen(m){ const c=[100,200,500,1000,2000,5000,10000]; return c.find(v=>v>=m)||c[c.length-1]; }
function svgMap(d,z,sel){
  const {order,seq}=zoneData(d,z);
  if(!order.length) return '<p style="padding:20px;color:var(--muted)">지도에 표시할 장소가 없어요.</p>';
  const {f,mPerPx}=project(order);
  let g='';
  for(let x=0;x<=W;x+=60) g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--grid)" stroke-width="1"/>`;
  for(let y=0;y<=H;y+=60) g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
  const line=seq.map(k=>f(P[k].ll).map(v=>v.toFixed(1)).join(',')).join(' ');
  const route=seq.length>1?`<polyline points="${line}" fill="none" stroke="var(--city)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>`:'';
  const doneK=k=>d.items.filter(it=>it.k===k&&it.z===z).every(it=>done.has(it.id));
  const pins=order.map((k,i)=>{
    const [x,y]=f(P[k].ll), right=x<W-150;
    return `<g class="pin ${sel===k?'sel':''}" data-pin="${k}" data-day="${d.id}" data-zone="${esc(z)}" tabindex="0" role="button" aria-label="${i+1}번 ${esc(P[k].n)}">
      <text class="lbl" x="${right?x+16:x-16}" y="${y+4}" text-anchor="${right?'start':'end'}">${esc(P[k].n)}</text>
      <circle cx="${x}" cy="${y}" r="12" fill="${doneK(k)?'var(--done)':'var(--city)'}"/>
      <text x="${x}" y="${y+4}" text-anchor="middle">${i+1}</text></g>`;
  }).join('');
  const L=niceLen(mPerPx*90), px=L/mPerPx;
  const scale=`<g class="scale" transform="translate(14,${H-18})"><line x1="0" y1="0" x2="${px.toFixed(1)}" y2="0" stroke="var(--muted)" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/><line x1="${px.toFixed(1)}" y1="-5" x2="${px.toFixed(1)}" y2="5" stroke="var(--muted)" stroke-width="2"/>
    <text x="${(px/2).toFixed(1)}" y="-8" text-anchor="middle">${L>=1000?L/1000+' km':L+' m'}</text></g>
    <g class="scale" transform="translate(${W-24},26)"><text x="0" y="0" text-anchor="middle">N</text><path d="M0 5 L-5 17 L0 14 L5 17Z" fill="var(--muted)"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.code)} ${esc(z)} 지도">${g}${route}${pins}${scale}</svg>`;
}

/* ───────── Leaflet 진짜 지도 (REAL_MAP=true 일 때만) ───────── */
let leafletP=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletP) return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  return leafletP;
}
function drawLeaflet(el,d,z){
  loadLeaflet().then(()=>{
    const {order,seq}=zoneData(d,z);
    const color=getComputedStyle(el).getPropertyValue(d.city===HK?'--hk':'--mo').trim();
    const map=L.map(el,{zoomControl:false,attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    order.forEach((k,i)=>{
      L.marker(P[k].ll,{icon:L.divIcon({className:'',html:`<div style="background:${color};color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px monospace;border:2px solid #fff">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]})})
        .addTo(map).bindPopup(`<b>${P[k].n}</b><br><a href="${dirUrl(k,ROUTE_MODE[z])}" target="_blank" rel="noopener">길찾기</a>`);
    });
    if(seq.length>1) L.polyline(seq.map(k=>P[k].ll),{color,weight:3,dashArray:'7 6'}).addTo(map);
    const b=L.latLngBounds(order.map(k=>P[k].ll));
    order.length>1?map.fitBounds(b,{padding:[30,30]}):map.setView(P[order[0]].ll,15);
  }).catch(()=>{el.outerHTML=svgMap(d,z,null);});
}

function dayHTML(d){

}

  if(REAL_MAP) v.querySelectorAll('[data-lf]').forEach(el=>drawLeaflet(el,DAYS.find(d=>d.id===el.dataset.lf),el.dataset.zone));
  renderNext();
}
function renderNext(){
  const pool=tab==='all'||tab==='info'?DAYS:DAYS.filter(d=>d.id===tab);
  let nxt=null; for(const d of pool){ nxt=d.items.find(i=>!done.has(i.id)); if(nxt){nxt.day=d;break;} }
  const what=document.getElementById('nextWhat'), go=document.getElementById('nextGo');
  if(!nxt){what.textContent='모두 완료했어요 🎉'; go.hidden=true; return;}
  what.textContent=`${nxt.day.code.replace('DAY ','D')} ${nxt.t} · ${nxt.h}`;
  if(nxt.k){go.hidden=false; go.href=dirUrl(nxt.k,nxt.m);} else go.hidden=true;
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo({top:y}); }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){tab=t.dataset.tab; try{localStorage.setItem(TABKEY,tab)}catch(_){}
    render(); window.scrollTo({top:0}); return;}
  const zt=e.target.closest('[data-zone-tab]');
  if(zt){zoneSel[zt.dataset.day]=zt.dataset.zoneTab; pinSel[zt.dataset.day]=null; keepScroll(render); return;}
  const pin=e.target.closest('[data-pin]');
  if(pin){const d=pin.dataset.day; pinSel[d]=pinSel[d]===pin.dataset.pin?null:pin.dataset.pin; keepScroll(render);
    const it=DAYS.find(x=>x.id===d).items.find(i=>i.k===pin.dataset.pin&&i.z===pin.dataset.zone);
    if(it&&pinSel[d]){const el=document.getElementById(it.id); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),900);}
    return;}
  const c=e.target.closest('.chk');
  if(c){const id=c.closest('.stop').dataset.id; done.has(id)?done.delete(id):done.add(id); save(); keepScroll(render); return;}
  const cp=e.target.closest('[data-copy]');
  if(cp){const txt=cp.dataset.copy;
    const fallback=()=>{const r=document.createRange(); r.selectNodeContents(cp.previousElementSibling.firstElementChild);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r);};
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>{cp.textContent='복사됨'; setTimeout(()=>cp.textContent='복사',1200)}).catch(fallback);
    else fallback(); return;}
  const r=e.target.closest('#reset');
  if(r){ if(!r.classList.contains('armed')){r.classList.add('armed'); r.textContent='한 번 더 누르면 지워져요'; return;}
    done.clear(); save(); render(); }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-pin]')){e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
render();
</script>
</body>
</html>
